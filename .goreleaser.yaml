version: 2

project_name: dforge

# Publishing is idempotent: a rerun of `make release` replaces the existing
# GitHub release body and assets instead of failing on them.
release:
  mode: replace
  # Installer scripts published as extra release assets. They are created in a
  # later slice; GoReleaser ignores non-matching extra_files globs by default,
  # so `goreleaser check` stays green while they do not exist yet.
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

# dforge has no go:generate directives, so the only pre-build hook is the
# module tidy that keeps the published go.mod honest.
before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: dforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ if .IsSnapshot }}{{.Version}}{{ else }}{{.Tag}}{{ end }}

archives:
  - formats: [tar.gz]
    # dforge_Linux_x86_64.tar.gz / dforge_Darwin_arm64.tar.gz — the installer
    # scripts construct exactly this shape (title-cased OS, x86_64/i386 arch).
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "snapshot-{{ .ShortCommit }}"

# No `changelog:` block is configured on purpose: the GitHub release body is
# supplied by `make release` through `--release-notes=RELEASE_NOTES.md`,
# extracted from the newest `## 📦` section of CHANGELOG.md, so GoReleaser must
# never generate one of its own.
